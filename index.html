<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cockpit — Project Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Dashboard-gauge motif: dial track + active arc + needle + pivot. -->
            <path d="M 12 41 A 20 20 0 0 1 52 41" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".4"/>
            <path d="M 12 41 A 20 20 0 0 1 47 26" stroke="currentColor" stroke-width="6"   stroke-linecap="round" fill="none"/>
            <line x1="32" y1="41" x2="44" y2="30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="32" cy="41" r="3.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-name">Cockpit</div>
      </div>

      <nav class="nav">
        <button class="nav-section nav-section-toggle" data-group="workspace" aria-expanded="true">Workspace<span class="nav-section-caret">▾</span></button>
        <div class="nav-group" data-group-body="workspace">
          <button class="nav-item" data-view="portfolio">
            <span class="nav-icon">▦</span><span>Portfolio</span>
          </button>
          <button class="nav-item" data-view="people">
            <span class="nav-icon">◔</span><span>People</span>
          </button>
          <button class="nav-item" data-view="team">
            <span class="nav-icon">◍</span><span>Team</span>
          </button>
          <button class="nav-item" data-view="activities">
            <span class="nav-icon">⟟</span><span>Activities</span>
          </button>
        </div>

        <button class="nav-section nav-section-toggle" data-group="work" aria-expanded="true">Work<span class="nav-section-caret">▾</span></button>
        <div class="nav-group" data-group-body="work">
        <button class="nav-item" data-view="board">
          <span class="nav-icon">▤</span><span>Board</span>
        </button>
        <button class="nav-item" data-view="register">
          <span class="nav-icon">≣</span><span>Register</span>
        </button>
        <button class="nav-item" data-view="actioncloud">
          <span class="nav-icon">◯</span><span>Cloud</span>
        </button>
        <button class="nav-item" data-view="openpoints">
          <span class="nav-icon">⚐</span><span>Open points</span>
        </button>
        <button class="nav-item" data-view="timeline">
          <span class="nav-icon">▬</span><span>Gantt</span>
        </button>
        <button class="nav-item" data-view="calendar">
          <span class="nav-icon">▦</span><span>Calendar</span>
        </button>
        <button class="nav-item" data-view="links">
          <span class="nav-icon">↗</span><span>Links</span>
        </button>
        </div>

        <button class="nav-section nav-section-toggle" data-group="insight" aria-expanded="true">Insight<span class="nav-section-caret">▾</span></button>
        <div class="nav-group" data-group-body="insight">
        <button class="nav-item" data-view="dashboard">
          <span class="nav-icon">◰</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="review">
          <span class="nav-icon">▶</span><span>Review</span>
        </button>
        <button class="nav-item" data-view="risks">
          <span class="nav-icon">△</span><span>Risks &amp; Opps</span>
        </button>
        <button class="nav-item" data-view="decisions">
          <span class="nav-icon">⬡</span><span>Decisions</span>
        </button>
        <button class="nav-item" data-view="changes">
          <span class="nav-icon">⇆</span><span>Change requests</span>
        </button>
        <button class="nav-item" data-view="components">
          <span class="nav-icon">▣</span><span>Components</span>
        </button>
        <button class="nav-item" data-view="budgets">
          <span class="nav-icon">€</span><span>Budgets</span>
        </button>
        </div>
      </nav>

      <div class="sidebar-foot">
        <button class="icon-btn" id="btnImport" title="Import JSON — replace or merge with current data">↓</button>
        <button class="icon-btn" id="btnExport" title="Export JSON — save current state to a file">↑</button>
        <button class="icon-btn" id="btnExportXLSX" title="Export project as Excel (.xlsx) — one sheet per data domain (Actions, Open points, Risks, Decisions, Change requests, People, Budgets)">⊞</button>
        <button class="icon-btn" id="btnAutoBackup" title="Auto-backup — pick a folder + frequency">⟳</button>
        <button class="icon-btn danger" id="btnEmpty" title="Start from zero — wipe everything">⊘</button>
        <button class="icon-btn" id="btnTheme" title="Toggle light / dark">◐</button>
      </div>
      <div id="autoBackupPanel" class="ab-panel" hidden></div>
    </aside>

    <header class="topbar">
      <button class="icon-btn" id="btnSidebarToggle" title="Toggle sidebar">≡</button>

      <div class="project-picker">
        <select id="projectSelect" aria-label="Project"></select>
        <button class="icon-btn" id="btnNewProject" title="New project">+</button>
      </div>

      <div class="search">
        <input id="search" type="search" placeholder="Search the current panel…" />
      </div>

      <div class="filters" id="filters">
        <select id="filterOwner"><option value="">All owners</option></select>
        <select id="filterComponent"><option value="">All components</option></select>
        <select id="filterStatus">
          <option value="">All status</option>
          <option value="todo">Not started</option>
          <option value="doing">In progress</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select id="filterDue">
          <option value="">All dates</option>
          <option value="late">Late</option>
          <option value="week">This week</option>
          <option value="month">This month</option>
        </select>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="btnUndo" title="Undo (Cmd/Ctrl+Z)">↶</button>
        <button class="icon-btn" id="btnRedo" title="Redo (Cmd/Ctrl+Shift+Z)">↷</button>
        <button class="icon-btn" id="btnNotesToggle" title="Toggle meeting notes (Cmd/Ctrl+\\)">✎</button>
        <button class="icon-btn icon-btn-bell" id="btnInbox" title="Inbox — items needing your attention">
          <span aria-hidden="true">⚑</span>
          <span class="bell-badge" id="bellBadge" hidden></span>
        </button>
        <button class="icon-btn" id="btnHelp" title="Keyboard shortcuts (?)">?</button>
        <button class="primary" id="btnQuickAdd" title="Open command palette (Cmd/Ctrl+K)">+ Quick add</button>
      </div>
    </header>

    <main class="main" id="main">
      <!-- views are injected dynamically -->
    </main>

    <aside class="notes-panel" id="notesPanel" hidden>
      <div class="notes-resize" id="notesResize" title="Drag to resize · double-click to reset" aria-label="Resize notes panel" role="separator"></div>
      <div class="notes-head">
        <div class="notes-meta" id="notesMeta" title=""></div>
        <div class="notes-head-actions">
          <button class="icon-btn" id="btnNotesCopy" title="Copy this entry — HTML for email + Markdown for anywhere" aria-label="Copy note">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5" y="3" width="8" height="10" rx="1.5"/><path d="M3 5v7a1.5 1.5 0 0 0 1.5 1.5H10"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesExport" title="Export the whole notebook as Markdown" aria-label="Export notebook">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9M4 8l4 4 4-4M3 14h10"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesSearch" title="Find in note (Cmd/Ctrl+F)" aria-label="Find in note">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4"/><path d="M13 13l-3-3"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesReading" title="Toggle reading mode (comfortable width + line-height)" aria-label="Toggle reading mode">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h7"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesHistory" title="Show recent versions (last 20 autosaves)" aria-label="Version history">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a5 5 0 1 1-1 3"/><path d="M2 3v3h3"/><path d="M8 5v3l2 1.5"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesFullscreen" title="Fullscreen (Esc to exit)" aria-label="Toggle fullscreen">
            <svg class="nt-fs-in" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="nt-fs-out" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btnNotesClose" title="Close (Cmd/Ctrl+\)" aria-label="Close notes">×</button>
        </div>
      </div>
      <div class="notes-toolbar" id="notesToolbar">
        <span class="nt-tb-group">
          <button data-cmd="bold" title="Bold (Cmd/Ctrl+B)" aria-label="Bold">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h5a2.5 2.5 0 0 1 0 5H4z"/><path d="M4 8h6a2.5 2.5 0 0 1 0 5H4z"/></svg>
          </button>
          <button data-cmd="italic" title="Italic (Cmd/Ctrl+I)" aria-label="Italic">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3l-3 10M6 3h5M4 13h5"/></svg>
          </button>
          <button data-cmd="underline" title="Underline (Cmd/Ctrl+U)" aria-label="Underline">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3v6a4 4 0 0 0 8 0V3M3 14h10"/></svg>
          </button>
        </span>
        <span class="sep"></span>
        <span class="nt-tb-group">
          <button data-cmd="formatBlock" data-arg="<h1>" title="Heading 1 (Cmd/Ctrl+1)" class="nt-h">H1</button>
          <button data-cmd="formatBlock" data-arg="<h2>" title="Heading 2 (Cmd/Ctrl+2)" class="nt-h">H2</button>
          <button data-cmd="formatBlock" data-arg="<h3>" title="Heading 3 (Cmd/Ctrl+3)" class="nt-h">H3</button>
          <button data-cmd="formatBlock" data-arg="<p>" title="Paragraph (Cmd/Ctrl+0) — H4/H5 available via Cmd/Ctrl+4/5">¶</button>
        </span>
        <span class="sep"></span>
        <span class="nt-tb-group">
          <button data-cmd="insertUnorderedList" title="Bullet list (Cmd/Ctrl+Shift+L)" aria-label="Bullet list">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="3" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M6 4h8M6 8h8M6 12h8"/></svg>
          </button>
          <button data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><text x="1" y="6" font-size="4" fill="currentColor" stroke="none">1.</text><text x="1" y="10" font-size="4" fill="currentColor" stroke="none">2.</text><text x="1" y="14" font-size="4" fill="currentColor" stroke="none">3.</text><path d="M6 4h8M6 8h8M6 12h8"/></svg>
          </button>
        </span>
        <span class="sep"></span>
        <span class="nt-tb-group">
          <label class="nt-color" title="Text colour">
            <span class="nt-color-glyph">A</span>
            <span class="nt-color-bar" id="ntColorBar"></span>
            <input type="color" id="ntColorInput" value="#6ea8ff" />
          </label>
          <button data-hl="ok"   class="nt-hl-btn nt-hl-btn-ok"   title="Highlight as success">✓</button>
          <button data-hl="warn" class="nt-hl-btn nt-hl-btn-warn" title="Highlight as warning">⚠</button>
          <button data-hl="bad"  class="nt-hl-btn nt-hl-btn-bad"  title="Highlight as failure">✕</button>
          <button data-hl="clear" title="Remove highlight">◌</button>
        </span>
        <span class="sep"></span>
        <span class="nt-tb-group">
          <button id="btnNotesInsertLink" title="Insert link (Cmd/Ctrl+K)" aria-label="Insert link">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 10a3 3 0 0 0 4 0l2-2a3 3 0 0 0-4-4l-1 1M10 6a3 3 0 0 0-4 0L4 8a3 3 0 0 0 4 4l1-1"/></svg>
          </button>
          <button id="btnNotesInsertHR" title="Divider (horizontal rule)" aria-label="Divider">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8h12"/></svg>
          </button>
          <button id="btnNotesInsertCode" title="Inline code (Cmd/Ctrl+Shift+X)" aria-label="Inline code">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4L2 8l3 4M11 4l3 4-3 4"/></svg>
          </button>
        </span>
        <span class="sep"></span>
        <button data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4L4 12"/></svg>
        </button>
      </div>
      <div class="notes-search" id="notesSearchBar" hidden>
        <input type="text" id="notesSearchInput" placeholder="Find in this note…" />
        <span class="nt-search-count" id="notesSearchCount"></span>
        <button type="button" id="notesSearchPrev" title="Previous match (Shift+Enter)">↑</button>
        <button type="button" id="notesSearchNext" title="Next match (Enter)">↓</button>
        <button type="button" id="notesSearchClose" title="Close (Esc)">×</button>
      </div>
      <div class="notes-entries" id="notesEntriesPanel">
        <div class="notes-entries-head">
          <input type="text" class="notes-entries-search" id="notesEntrySearch" placeholder="Search entries…" />
          <button type="button" class="notes-entries-new" id="btnNotesNewEntry" title="New entry (choose template)" aria-label="New entry">+</button>
        </div>
        <label class="notes-entries-arch" title="Include archived entries in the list">
          <input type="checkbox" id="notesShowArchived" /> Show archived
        </label>
        <div class="notes-entry-list" id="notesEntryList"></div>
      </div>
      <nav class="notes-toc" id="notesToc" aria-label="Notes contents" hidden></nav>
      <div class="notes-toc-resize" id="notesTocResize" title="Drag to resize · double-click to reset" aria-label="Resize table of contents" role="separator" hidden></div>
      <div class="notes-body" id="notesBody" contenteditable="true" spellcheck="true"></div>
      <div class="notes-foot">
        <span id="notesSaved">Saved</span>
        <span class="hint"><kbd>@</kbd> new action for someone · <kbd>#</kbd> link existing action · <kbd>Cmd/Ctrl+Shift+A</kbd> new action</span>
      </div>
      <div class="notes-ac" id="notesAutocomplete" hidden role="listbox"></div>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <!-- Persistent storage status line — shows save status, origin, and
         backup state. Click to open the Storage panel. -->
    <button class="storage-status" id="storageStatus" type="button" title="Storage details">
      <span class="storage-status-dot" id="storageStatusDot" aria-hidden="true"></span>
      <span class="storage-status-text" id="storageStatusText">Saving…</span>
    </button>
  </div>

  <!-- Quick add overlay -->
  <div class="overlay" id="quickAdd" hidden>
    <div class="qa-panel">
      <div class="qa-tabs">
        <button class="qa-tab active" data-qa="action">Action</button>
        <button class="qa-tab" data-qa="deliverable">Deliverable</button>
        <button class="qa-tab" data-qa="milestone">Milestone</button>
        <button class="qa-tab" data-qa="risk">Risk / Opportunity</button>
        <button class="qa-tab" data-qa="decision">Decision</button>
        <button class="qa-tab" data-qa="change">Change request</button>
        <button class="qa-tab" data-qa="meeting">Meeting</button>
        <button class="qa-tab" data-qa="link">Link</button>
        <button class="qa-tab" data-qa="component">Component</button>
        <button class="qa-tab" data-qa="person">Person</button>
        <button class="qa-tab" data-qa="project">Project</button>
      </div>
      <div class="qa-body" id="qaBody"></div>
      <div class="qa-foot">
        <span class="hint">Tip: <kbd>Tab</kbd> to move • <kbd>Enter</kbd> to save • <kbd>Esc</kbd> to close</span>
        <div>
          <button class="ghost" id="qaCancel">Cancel</button>
          <button class="primary" id="qaSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail drawer -->
  <div class="overlay drawer-overlay" id="drawer" hidden>
    <div class="drawer">
      <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle">Details</div>
        <div class="drawer-head-actions" id="drawerHeadActions"></div>
        <button class="icon-btn" id="drawerClose">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- Universal Cmd+K palette (Phase C) -->
  <div class="overlay palette-overlay" id="paletteOverlay" hidden>
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-input-row">
        <span class="palette-glyph" aria-hidden="true">⌕</span>
        <input id="paletteInput" type="text" placeholder="Search anything · type / for commands" autocomplete="off" />
        <button class="icon-btn" id="paletteClose" title="Close (Esc)">×</button>
      </div>
      <div class="palette-results" id="paletteResults" role="listbox"></div>
      <div class="palette-foot">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>Enter</kbd> open</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Keyboard cheatsheet modal (Phase B) -->
  <div class="overlay desc-overlay" id="helpOverlay" hidden>
    <div class="desc-modal" style="width:620px;">
      <div class="desc-head">
        <div class="desc-title">Walkthroughs &amp; keyboard shortcuts</div>
        <button class="icon-btn" id="helpClose" title="Close">×</button>
      </div>
      <div class="help-body" id="helpBody"></div>
      <div class="desc-foot">
        <span class="hint" style="margin-right:auto; color:var(--text-faint); font-size:11px;">Tip: open this any time with <kbd>?</kbd></span>
        <button class="primary" id="helpDone">Got it</button>
      </div>
    </div>
  </div>

  <!-- Floating personal to-do — project-independent quick list -->
  <button id="todoFab" class="todo-fab" type="button" title="My to-do list" aria-label="Open to-do list">
    <span class="todo-fab-icon" aria-hidden="true">✓</span>
    <span class="todo-fab-badge" id="todoFabBadge" hidden></span>
  </button>
  <div id="todoPanel" class="todo-panel" hidden>
    <div class="todo-head">
      <span class="todo-title">My to-do</span>
      <span class="todo-meta" id="todoMeta"></span>
      <button class="icon-btn" id="todoClose" title="Close" aria-label="Close">×</button>
    </div>
    <div class="todo-add">
      <input id="todoInput" type="text" placeholder="Add a personal to-do…" />
      <button class="ghost" id="todoAdd" type="button" title="Add">+</button>
    </div>
    <div class="todo-list" id="todoList"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
